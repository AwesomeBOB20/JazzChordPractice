apply plugin: 'com.android.library'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

// 1. Bypass the broken Maven classpath resolution entirely.
// Instead, directly apply the Expo Core plugin from the node_modules project path.
def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()

android {
    namespace "expo.modules.nativetuner"
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22"
    implementation project(':expo-modules-core')
    implementation "androidx.core:core-ktx:1.12.0"
}

// Fixes the "Could not get unknown property 'release'" error for Expo modules on Gradle 8+
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                publishing {
                    singleVariant("release") {
                        withSourcesJar()
                    }
                }
            }
        }
    }
}